# From: https://github.com/rkdarst/sphinx-actions-test/blob/master/.github/workflows/sphinx-build.yml
name: Sphinx

on:
  # Every push builds, on any branch. A PR from a branch of this repo shows the
  # result of that push run; pull_request only builds PRs from forks (see the
  # Build job), so that a change is never built twice.
  push:
    # the submodules are not ignored: they bring the configurators (/configurateur/,
    # /configurateur-monophase/)
    paths-ignore:
      - '.gitmodules'
      - 'hardware/**'
  pull_request:
    # the submodules are not ignored: they bring the configurators (/configurateur/,
    # /configurateur-monophase/)
    paths-ignore:
      - '.gitmodules'
      - 'hardware/**'
  workflow_dispatch: {}
  # Every night, the dev version is rebuilt, to pick up the firmware dev
  # (a submodule, which does not trigger a build by itself). GITHUB_REF is the
  # default branch (main) on a schedule: the dev branch is named explicitly.
  # (A schedule always runs the workflow file of the default branch.)
  schedule:
    - cron: '17 3 * * *'

# One run at a time per branch (or fork PR): a new push cancels the run of the
# previous commit. Deployments (main, legacy and dev) are never cancelled. The
# scheduled run has its own group: it builds dev, and must not replace a queued
# run of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule-dev' || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/legacy' && github.ref != 'refs/heads/dev' }}

# If these SPHINXOPTS are enabled, then be strict about the builds and
# fail on any warnings
#env:
#  SPHINXOPTS: "-W --keep-going -T"


jobs:
  # The build environment (.github/docs-image/Dockerfile), on GHCR: built only
  # when its tag is missing, i.e. when the Dockerfile or requirements.txt
  # changes, and once a month. A fork PR cannot push: it uses the latest image,
  # and Build installs what requirements.txt adds.
  Image:
    name: Build environment
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          sparse-checkout: |
            .github/docs-image
            requirements.txt
          sparse-checkout-cone-mode: false

      # The registry API says whether the tag exists: no docker login for
      # that, only when the image has to be built
      - name: Is the image already built?
        id: image
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY,,}-docs"
          key=$(cat .github/docs-image/Dockerfile requirements.txt | sha256sum | cut -c1-16)
          tag="$(date -u +%Y%m)-$key"
          registry_token=$(curl -fsS -u "$ACTOR:$TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)
          if curl -fsS -o /dev/null -H "Authorization: Bearer $registry_token"               -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"               "https://ghcr.io/v2/$repo/manifests/$tag"; then
            echo "Image ghcr.io/$repo:$tag already built"
            build=false
          elif [ "$FORK_PR" = "true" ]; then
            echo "A fork PR cannot push ghcr.io/$repo:$tag: the latest image is used"
            tag=latest
            build=false
          else
            echo "Image ghcr.io/$repo:$tag to build"
            build=true
          fi
          echo "name=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo:$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ steps.image.outputs.build == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: ${{ steps.image.outputs.build == 'true' }}
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          NAME: ${{ steps.image.outputs.name }}
        run: |
          docker build -f .github/docs-image/Dockerfile -t "$IMAGE" -t "$NAME:latest" .
          docker push "$IMAGE"
          docker push "$NAME:latest"

  Build:
    name: Build and gh-pages
    needs: [Image]
    runs-on: ubuntu-latest
    # Everything the build needs is in the image (see the Image job)
    container:
      image: ${{ needs.Image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    outputs:
      # The branch built: dev for a schedule, the pushed branch otherwise
      branch: ${{ steps.branch.outputs.branch }}

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A schedule runs on the default branch: build dev instead (the run
          # fails here if dev does not exist yet, nothing is deployed)
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: 0
          lfs: true
          submodules: true

      # In the container, the workspace belongs to another user than root, and
      # git refuses it ("dubious ownership") once the checkout is done; the
      # build needs git (sphinx_last_updated_by_git), submodules included
      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      # The branch built, computed once: GITHUB_REF is main on a schedule.
      # And the firmware it documents: dev for dev and for the branches based
      # on dev (they share commits with dev that main does not have), or the
      # base branch of a fork PR; the pinned submodules (main) otherwise.
      - name: Get the branch built
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            brname=dev
          else
            brname="${REF##refs/heads/}"
          fi
          firmware=pinned
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ "$BASE_REF" = "dev" ] && firmware=dev
          elif [ "$brname" = "dev" ]; then
            firmware=dev
          elif [ "$brname" != "main" ] && [ "$brname" != "legacy" ]               && git rev-parse -q --verify origin/dev > /dev/null; then
            base=$(git merge-base HEAD origin/dev)
            git merge-base --is-ancestor "$base" origin/main || firmware=dev
          fi
          echo "branch=$brname" >> $GITHUB_OUTPUT
          echo "firmware=$firmware" >> $GITHUB_OUTPUT
          echo "Branch built: $brname, firmware: $firmware"

      # The dev documentation describes the dev firmware, not the one pinned by
      # the submodules (the checkout above gives the commits recorded in them)
      - name: Pull the firmware dev
        if: ${{ steps.branch.outputs.firmware == 'dev' }}
        run: |
          for sub in 1-phase 3-phase; do
            git -C $sub fetch origin dev
            git -C $sub checkout FETCH_HEAD
            git -C $sub log --oneline -1
          done

      # The image has requirements.txt installed. A fork PR runs on the latest
      # image, which may predate its requirements.txt: only then add what it brings
      - name: Install Python dependencies (fork PR on the latest image)
        if: ${{ endsWith(needs.Image.outputs.image, ':latest') }}
        run: pip install --root-user-action=ignore --no-cache-dir -r requirements.txt

      - name: Debugging information
        run: |
          echo "github.ref:" ${{github.ref}}
          echo "github.event_name:" ${{github.event_name}}
          echo "github.head_ref:" ${{github.head_ref}}
          echo "github.base_ref:" ${{github.base_ref}}
          git rev-parse --abbrev-ref HEAD
          git branch
          git branch -a
          git remote -v

      - name: Run the tests
        run: python -m pytest tests -q

      - name: List installed python packages
        run: |
          pip list

      # Build
      - uses: sphinx-doc/github-problem-matcher@master
      # conf.py reads the branch from DOC_BRANCH: GITHUB_* variables cannot be
      # overridden in a workflow. Empty for a fork PR (built as stable).
      - name: Build Sphinx documentation
        env:
          DOC_BRANCH: ${{ github.event_name != 'pull_request' && steps.branch.outputs.branch || '' }}
        run: |
          make dirhtml

      - name: Generate PDF
        env:
          DOC_BRANCH: ${{ github.event_name != 'pull_request' && steps.branch.outputs.branch || '' }}
        run: |
          make simplepdf
          mkdir -p _build/dirhtml/_static
          cp "_build/simplepdf/Documentation du Mk2PVRouter.pdf" _build/dirhtml/_static/Mk2PVRouter.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: _build

  # The following supports building all branches and combining on
  # gh-pages

  # Clone gh-pages, add the new build, publish: one job, so that the whole
  # sequence is atomic. Only the deploy branches (main, legacy, dev) publish;
  # the other branches and the fork PRs are built (a check) but not published.
  # GitHub keeps one pending job per concurrency group: three deploy-branch
  # runs queued at once can drop the middle one (accepted: the next push or
  # the nightly build republishes).
  Deploy:
    name: Update and deploy gh-pages
    runs-on: ubuntu-latest
    needs: [Build]
    # The branch built, not github.ref (main on a schedule, which builds dev)
    if: ${{ contains(fromJSON('["main", "legacy", "dev"]'), needs.Build.outputs.branch) && github.event_name != 'pull_request' }}
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      BRANCH: ${{ needs.Build.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/download-artifact@v8
        with:
          name: my-artifact
          path: _build

      - name: Clone old gh-pages
        run: |
          set -x
          git fetch
          ( git branch gh-pages remotes/origin/gh-pages && git clone . --branch=gh-pages _gh-pages/ ) || mkdir _gh-pages
          rm -rf _gh-pages/.git/
          mkdir -p _gh-pages/branch/
      # If main, copy build to _gh-pages/ as the "main" deployment.
      - name: Copy new build (main)
        if: ${{ env.BRANCH == 'main' }}
        run: |
          set -x
          # Delete everything under _gh-pages/ that is from the
          # primary branch deployment.  Excludes the other branches
          # _gh-pages/branch-* paths, and not including
          # _gh-pages itself.
          find _gh-pages/ -mindepth 1 ! -path '_gh-pages/branch*' -delete
          rsync -a _build/dirhtml/ _gh-pages/
      # legacy or dev (also the nightly dev build): copy the build to
      # _gh-pages/branch/$brname (transforming '/' into '--')
      - name: Copy new build (branch)
        if: ${{ env.BRANCH != 'main' }}
        run: |
          set -x
          brname="$BRANCH"
          brdir=${brname//\//--}   # replace '/' with '--'
          rm -rf   _gh-pages/branch/${brdir}
          rsync -a _build/dirhtml/ _gh-pages/branch/${brdir}
      # Go through each branch in _gh-pages/branch/, if it's not a
      # ref, then delete it.
      - name: Delete old feature branches
        run: |
          set -x
          for brdir in `ls _gh-pages/branch/` ; do
              brname=${brdir//--/\/}   # replace '--' with '/'
              if ! git show-ref remotes/origin/$brname ; then
                  echo "Removing $brdir"
                  rm -r _gh-pages/branch/$brdir/
              fi
          done

      # https://github.com/peaceiris/actions-gh-pages
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _gh-pages/
          force_orphan: true
